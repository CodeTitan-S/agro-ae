services:
  db:
    image: postgres:16-alpine
    container_name: agroae_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agro_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: agroae_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: